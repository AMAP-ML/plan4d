args:
  dataset_base_path: datasets
  manifest_data_root: datasets
  manifest_process_res_method: upper_bound_resize
  train_manifest:
    - omniworld:manifests/joint/omniworld_train_ti2v_81f.jsonl
  action100m_manifest: manifests/joint/action100m_train_ti2v_81f.jsonl
  model_paths:
    - [checkpoints/longcat/dit/*.safetensors]
    - [checkpoints/longcat/text_encoder/*.safetensors]
    - checkpoints/Wan2.1_VAE.safetensors
  tokenizer_path: checkpoints/longcat/tokenizer
  wan_vae_path: checkpoints/longcat/vae
  da3_model_path: checkpoints/da3
  da3_enable_scene_flow_head: true
  da3_scene_flow_head_checkpoint_path: checkpoints/scene_flow_head.bin
  stitched_joint_training: true
  stitched_decoder_checkpoint_path: checkpoints/stitched_decoder.pth
  geometry_supervision_mode: distill
  geo_supervise_generated_only: true
  mask_condition_loss: true
  height: 504
  width: 504
  num_frames: 81
  stitched_resolution: 504
  feedforward_resolution: 504
  dataset_repeat: 100
  dataset_num_workers: 4
  learning_rate: 1.0e-4
  num_epochs: 5
  lora_base_model: dit
  lora_target_modules: adaLN_modulation.1,attn.qkv,attn.proj,cross_attn.q_linear,cross_attn.kv_linear,cross_attn.proj,ffn.w1,ffn.w2,ffn.w3
  lora_rank: 32
  lora_alpha: 32
  use_gradient_checkpointing: true
  use_gradient_checkpointing_offload: true
  remove_prefix_in_ckpt: pipe.dit.
  dual_task_ratio: '6,4'
  continuation_cond_choices: '9,13,17'
  condition_dropout: 0.1
  geo_loss_weight: 1.0
  distill_loss_weight_depth: 1.0
  distill_loss_weight_depth_grad: 0.01
  distill_loss_weight_ray: 1.0
  distill_loss_weight_camera: 1.0
  distill_loss_weight_depth_conf: 0.005
  distill_loss_weight_ray_conf: 0.005
  distill_loss_weight_scene_flow: 1.0
  geo_loss_warmup_start: 0.001
  geo_loss_warmup_steps: 500
  save_steps: 50
  output_path: outputs/joint
